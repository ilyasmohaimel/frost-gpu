<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc"><title id="title">Separate rendering from synchronization</title><desc id="desc">Wrapped apps and KWin choose iGPU or RX. Frame synchronization and the internal panel stay on iGPU. Runtime suspend is verified separately.</desc>
<rect width="1120" height="470" rx="18" fill="#edf4f9"/>
<g font-family="system-ui,sans-serif" fill="#142d45"><text x="40" y="56" font-size="27" font-weight="650">Rendering can move. The display path stays put.</text></g>
<g fill="none" stroke="#51728c" stroke-width="3"><path d="M305 163H344V301H305M344 235H365V169H385M365 235V299H385M625 169H745M625 299H690V198H745M905 231V278"/><path d="m735 159 10 10-10 10M735 188l10 10-10 10M895 268l10 10 10-10"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#142d45">
<rect x="40" y="120" width="265" height="88" rx="12" fill="#fff" stroke="#b6c9d7"/><text x="172" y="156" font-size="23" font-weight="600">Wrapped applications</text><text x="172" y="185" font-size="17">Supported Vulkan state</text>
<rect x="40" y="255" width="265" height="88" rx="12" fill="#fff" stroke="#b6c9d7"/><text x="172" y="292" font-size="23" font-weight="600">KWin compositor</text><text x="172" y="321" font-size="17">Guarded renderer switch</text>
<rect x="385" y="120" width="240" height="96" rx="12" fill="#d9eaf7" stroke="#628faf" stroke-width="2"/><text x="505" y="160" font-size="26" font-weight="650">iGPU</text><text x="505" y="190" font-size="17">Battery / USB-C</text>
<rect x="385" y="255" width="240" height="96" rx="12" fill="#f5e4d9" stroke="#a66343" stroke-width="2"/><text x="505" y="295" font-size="26" font-weight="650">RX 6800M</text><text x="505" y="325" font-size="17">Barrel charger</text>
<rect x="745" y="116" width="325" height="115" rx="12" fill="#d9eaf7" stroke="#628faf" stroke-width="2"/><text x="907" y="158" font-size="23" font-weight="650">Frame synchronization</text><text x="907" y="193" font-size="19">Always on iGPU</text>
<rect x="745" y="278" width="325" height="73" rx="12" fill="#fff" stroke="#b6c9d7"/><text x="907" y="322" font-size="23" font-weight="600">Internal panel on iGPU</text>
<text x="560" y="420" font-size="19">RX power-off is observed separately: runtime suspended + PCI D3cold.</text>
