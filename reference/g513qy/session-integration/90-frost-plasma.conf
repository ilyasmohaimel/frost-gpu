[Unit]
Wants=frost-gpu-render.service
After=frost-gpu-render.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -x /usr/local/libexec/frost-gpu-session ] && [ -r /usr/local/libexec/frost_session.py ]; then exec /usr/local/libexec/frost-gpu-session plasma --no-respawn; else exec /usr/bin/plasmashell --no-respawn; fi'
